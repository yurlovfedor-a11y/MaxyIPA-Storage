<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MaxyIPA Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --accent-text: var(--tg-theme-button-text-color, #0f172a);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; }
    header { margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; }
    p.sub { font-size: 13px; color: var(--hint); margin-top: 4px; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .title { font-size: 15px; font-weight: 600; }
    .filename { font-size: 12px; color: var(--hint); margin-top: 2px; }
    .install-btn {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .install-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <header>
    <h1>MaxyIPA Store</h1>
    <p class="sub">Нажмите «Установить» и подтвердите открытие в iTunes / Safari</p>
  </header>

  <main class="list" id="appList"></main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Список приложений
    const apps = [
      { name: "СберБанк", file: "sberbank.ipa" },
      { name: "Т-Банк", file: "tbank.ipa" },
      { name: "ВТБ Онлайн", file: "vtb.ipa" },
      { name: "Альфа-Банк", file: "alfabank.ipa" },
      { name: "РЖД Пассажирам", file: "rzd.ipa" },
      { name: "Авито", file: "avito.ipa" },
      { name: "ПСБ Банк", file: "psb.ipa" },
      { name: "Совкомбанк", file: "sovkom.ipa" },
      { name: "МТС Банк", file: "mtsbank.ipa" },
      { name: "ЮMoney", file: "ymoney.ipa" },
      { name: "Банк Зенит", file: "zenit.ipa" },
      { name: "Ак Барс Банк", file: "akbarrs.ipa" },
      { name: "МКБ Онлайн", file: "mkb.ipa" },
      { name: "Т-Инвестиции", file: "tinvest.ipa" },
      { name: "Альфа-Инвестиции", file: "alfainvest.ipa" },
      { name: "ВТБ Мои Инвестиции", file: "vtbinvest.ipa" },
      { name: "Газпром Инвестиции", file: "gazprominvest.ipa" },
      { name: "СберМобайл", file: "sbermobile.ipa" },
      { name: "Альфа-Бизнес", file: "alfabis.ipa" },
      { name: "Т-Бизнес", file: "tbis.ipa" },
      { name: "ВТБ Бизнес", file: "vtbbis.ipa" },
      { name: "Дом.ру", file: "domru.ipa" },
      { name: "Финуслуги", file: "finuslugi.ipa" },
      { name: "Movix", file: "movix.ipa" },
      { name: "HomeFamily", file: "homefamily.ipa" }
    ];

    const list = document.getElementById("appList");
    const baseUrl = "https://yurlovfedor-a11y.github.io/MaxyIPA-Storage";

    apps.forEach(app => {
      const card = document.createElement("div");
      card.className = "card";
      
      // Ссылка ведет на реальный .plist файл
      const plistUrl = `${baseUrl}/manifest.plist`;
      const itmsUrl = `itms-services://?action=download-manifest&url=${encodeURIComponent(plistUrl)}`;

      card.innerHTML = `
        <div class="info">
          <div class="title">${app.name}</div>
          <div class="filename">${app.file}</div>
        </div>
        <a class="install-btn" href="${itmsUrl}">Установить</a>
      `;

      card.querySelector(".install-btn").addEventListener("click", (e) => {
        // Если открыто внутри Telegram Mini App, вызываем системное открытие
        if (tg && tg.openLink) {
          e.preventDefault();
          tg.openLink(itmsUrl);
        }
      });

      list.appendChild(card);
    });
  </script>
</body>
</html>
