<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MaxyIPA Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --accent-text: var(--tg-theme-button-text-color, #0f172a);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 30px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    p.sub {
      font-size: 13px;
      color: var(--hint);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filename {
      font-size: 12px;
      color: var(--hint);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .install-btn {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .install-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>MaxyIPA Store</h1>
    <p class="sub">Установка приложений напрямую на iOS</p>
  </header>

  <main class="list" id="appList"></main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const BASE_RELEASE_URL = "https://github.com/yurlovfedor-a11y/MaxyIPA-Storage/releases/download/god/";

    const apps = [
      { name: "СберБанк", file: "sberbank.ipa", id: "ru.sberbank.online" },
      { name: "Т-Банк", file: "tbank.ipa", id: "com.tcsbank.tinkoff" },
      { name: "ВТБ Онлайн", file: "vtb.ipa", id: "ru.vtb24.mobilebanking.iphone" },
      { name: "Альфа-Банк", file: "alfabank.ipa", id: "ru.alfabank.mobile" },
      { name: "РЖД Пассажирам", file: "rzd.ipa", id: "ru.rzd.pass" },
      { name: "Авито", file: "avito.ipa", id: "ru.avito" },
      { name: "ПСБ Банк", file: "psb.ipa", id: "ru.psbank" },
      { name: "Совкомбанк", file: "sovkom.ipa", id: "ru.sovcombank.halvacard" },
      { name: "МТС Банк", file: "mtsbank.ipa", id: "ru.mts.money" },
      { name: "ЮMoney", file: "ymoney.ipa", id: "ru.yoomoney" },
      { name: "Банк Зенит", file: "zenit.ipa", id: "ru.zenit.online" },
      { name: "Ак Барс Банк", file: "akbarrs.ipa", id: "ru.akbars" },
      { name: "МКБ Онлайн", file: "mkb.ipa", id: "ru.mkb.mobile" },
      { name: "Т-Инвестиции", file: "tinvest.ipa", id: "com.tinkoff.invest" },
      { name: "Альфа-Инвестиции", file: "alfainvest.ipa", id: "ru.alfabank.broker" },
      { name: "ВТБ Мои Инвестиции", file: "vtbinvest.ipa", id: "ru.vtb.invest" },
      { name: "Газпром Инвестиции", file: "gazprominvest.ipa", id: "ru.gazprombank.invest" },
      { name: "СберМобайл", file: "sbermobile.ipa", id: "ru.sberbank.sbermobile" },
      { name: "Альфа-Бизнес", file: "alfabis.ipa", id: "ru.alfabank.business" },
      { name: "Т-Бизнес", file: "tbis.ipa", id: "com.tinkoff.business" },
      { name: "ВТБ Бизнес", file: "vtbbis.ipa", id: "ru.vtb.business" },
      { name: "Дом.ру", file: "domru.ipa", id: "ru.ertelecom.domru" },
      { name: "Финуслуги", file: "finuslugi.ipa", id: "ru.moex.finuslugi" },
      { name: "Movix", file: "movix.ipa", id: "ru.ertelecom.erhost" },
      { name: "HomeFamily", file: "homefamily.ipa", id: "com.homefamily" }
    ];

    const list = document.getElementById("appList");

    apps.forEach(app => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="info">
          <div class="title">${app.name}</div>
          <div class="filename">${app.file}</div>
        </div>
        <button class="install-btn">Установить</button>
      `;

      card.querySelector(".install-btn").addEventListener("click", () => {
        installApp(app);
      });

      list.appendChild(card);
    });

    function installApp(app) {
      const ipaUrl = BASE_RELEASE_URL + app.file;
      
      // Сгенерированный manifest.plist
      const plistContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>items</key>
  <array>
    <dict>
      <key>assets</key>
      <array>
        <dict>
          <key>kind</key>
          <string>software-package</string>
          <key>url</key>
          <string>${ipaUrl}</string>
        </dict>
      </array>
      <key>metadata</key>
      <dict>
        <key>bundle-identifier</key>
        <string>${app.id}</string>
        <key>bundle-version</key>
        <string>1.0.0</string>
        <key>kind</key>
        <string>software</string>
        <key>title</key>
        <string>${app.name}</string>
      </dict>
    </dict>
  </array>
</dict>
</plist>`;

      // Кодируем манифест в data:uri
      const plistDataUri = "data:text/xml;charset=utf-8," + encodeURIComponent(plistContent);
      const itmsUrl = `itms-services://?action=download-manifest&url=${encodeURIComponent(plistDataUri)}`;

      if (tg && tg.openLink) {
        tg.openLink(itmsUrl);
      } else {
        window.location.href = itmsUrl;
      }
    }
  </script>
</body>
</html>
